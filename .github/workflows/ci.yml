# PR마다 유니티 프로젝트를 컴파일하고 EditMode·PlayMode 테스트를 돌리는 워크플로.
#
# 흐름: [changes] 유니티 관련 파일이 바뀌었는지 판정
#       → [Unity Tests] 체크아웃 → Library 캐시 복원 → GameCI CLI 설치
#          → game-ci test (도커 안에서 활성화·테스트·반납) → 결과 XML을 PR 체크로 게시 → 아티팩트 업로드
#
# 경로 판정을 트리거의 paths 필터가 아니라 잡 안에서 하는 이유:
#   main·dev 보호 규칙이 "Unity Tests" 체크를 요구한다. 트리거 필터로 워크플로 자체를 건너뛰면
#   문서만 바뀐 PR에는 체크가 생기지 않아 머지가 막히고, 반대 조건의 통과용 워크플로를 따로 두면
#   같은 커밋에 같은 이름의 체크가 두 개 생겨 가짜 통과가 진짜 실패를 가릴 수 있다.
#   대신 모든 PR에서 워크플로를 띄우고, 유니티 파일 변경이 없으면 "Unity Tests" 잡을 skipped로
#   끝낸다. GitHub은 필수 체크가 skipped면 통과로 취급하므로 체크는 항상 정확히 하나다.
#
# 왜 GameCI CLI인가:
#   유니티는 Personal 라이선스의 파일 기반 활성화(.alf/.ulf)를 없앴다. 지금 Personal은
#   계정에 묶인 온라인 시트라서, CI 러너 안에서 Unity ID로 직접 활성화하고 끝나면 반납해야 한다.
#   game-ci/unity-test-runner 액션은 아직 .ulf 파일을 전제하고, 이 계정 활성화는 GameCI CLI에만 있다.
#   CLI는 우분투 러너의 도커로 유니티 에디터 이미지를 띄우고 그 안에서
#   "라이선스 활성화 → 테스트 → 라이선스 반납"을 한 컨테이너에서 처리한다. 잡이 실패하거나
#   취소돼도 반납이 실행되도록 스크립트 안에 EXIT 트랩이 걸려 있다.
#
# 필요한 Secret 2개 (CI 전용 개인 Unity ID. 2단계 인증은 꺼져 있어야 한다):
#   UNITY_EMAIL    : Unity ID 이메일
#   UNITY_PASSWORD : Unity ID 비밀번호
#   두 값만 있으면 CLI가 활성화 방식을 자동으로 personal로 고른다. UNITY_LICENSE / UNITY_SERIAL은 두지 않는다.

name: CI

on:
  # PR을 열거나 갱신할 때만 돈다. 대상 브랜치는 제한하지 않는다.
  # 경로 필터는 두지 않는다. 어떤 파일이 바뀌었는지는 아래 changes 잡이 판정한다.
  pull_request:
  # 라이선스 문제 등을 PR 없이 확인할 때 Actions 탭에서 버튼으로 실행한다. 이때는 변경 감지 없이 항상 테스트한다.
  workflow_dispatch:

# Personal 시트는 계정당 하나라서 동시에 두 실행이 활성화를 시도하면 뒤의 것이 실패한다.
# 저장소 전체에서 한 번에 하나만 돌게 직렬화한다. 같은 브랜치에 연속 푸시하면 대기 중인 이전 실행은 자동으로 취소된다.
concurrency:
  group: unity-personal-seat
  cancel-in-progress: false

# 워크플로가 GitHub API에 쓸 수 있는 최소 권한.
# checks: write 는 테스트 결과를 PR 체크로 올리기 위해,
# pull-requests: read 는 변경 감지(paths-filter)와 리포터가 PR의 변경 파일 목록을 읽기 위해 필요하다.
permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  # 1단계: 이 PR에서 유니티 관련 파일이 바뀌었는지 판정한다.
  # dorny/paths-filter는 PR의 베이스 브랜치와 비교한 변경 파일 전체를 GitHub API로 직접 계산하므로,
  # 트리거의 paths 필터와 달리 마지막 푸시 내용에 따라 결과가 흔들리지 않는다.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unity: ${{ steps.filter.outputs.unity }}
    steps:
      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            unity:
              - "Assets/**"
              - "Packages/**"
              - "ProjectSettings/**"
              - ".github/workflows/**"

  # 2단계: 유니티 파일이 바뀐 PR, 또는 수동 실행일 때만 실제 테스트를 돈다.
  # 조건이 거짓이면 이 잡은 skipped로 끝나고, 보호 규칙은 그것을 통과로 본다.
  test:
    name: Unity Tests
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.unity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # 저장소를 러너로 받는다. LFS는 쓰지 않으므로 끈다.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      # 에디터 이미지가 5GB가 넘는다. 러너 디스크가 모자라 이미지 pull에 실패하면 이 스텝의 주석을 푼다.
      # 러너에 기본으로 깔린 대형 툴체인(.NET, Android SDK 등)을 지워 수십 GB를 확보한다.
      # - name: Free disk space
      #   uses: jlumbroso/free-disk-space@v1.3.1
      #   with:
      #     tool-cache: false
      #     android: true
      #     dotnet: true
      #     haskell: true
      #     large-packages: true
      #     swap-storage: true

      # 유니티가 프로젝트를 열 때 만드는 Library 폴더를 캐시한다.
      # 패키지 목록이나 에디터 버전이 같으면 이전 Library를 그대로 써서 몇 분을 아낀다.
      # key가 정확히 일치하면 그 캐시를, 아니면 restore-keys로 가장 최근 Library- 캐시를 쓴다.
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-

      # GameCI CLI 바이너리를 러너에 설치한다.
      # game-ci/cli 액션(uses)은 저장소의 install.sh에 실행 권한이 빠져 있어 "Permission denied"로 실패하므로,
      # README에 문서화된 curl 설치 스크립트를 직접 실행한다. 설치 스크립트와 CLI 릴리즈를 같은 태그로 고정한다.
      # 계정 기반 Personal 활성화는 v0.1.69 이상에 들어 있다.
      - name: Install GameCI CLI
        env:
          GAME_CI_VERSION: v0.1.69
          GAME_CI_INSTALL: ${{ runner.temp }}/game-ci/bin
        run: |
          curl -fsSL "https://raw.githubusercontent.com/game-ci/cli/${GAME_CI_VERSION}/install.sh" | sh
          echo "$GAME_CI_INSTALL" >> "$GITHUB_PATH"
          "$GAME_CI_INSTALL/game-ci" --version

      # 유니티 에디터 도커 이미지 안에서 활성화 → 테스트 → 반납을 한 번에 실행한다.
      #   --docker            : 도커 이미지 기반의 유니티 배치모드 테스트 흐름을 쓴다(호스트에 유니티 없음).
      #   --testPlatforms     : editmode와 playmode를 순서대로 돌린다. 세미콜론으로 구분.
      #   --coverageEnabled   : 코드 커버리지 계측을 끈다. 켜면 커버리지 패키지가 없는 프로젝트에서 실패할 수 있다.
      #   --artifactsPath     : 결과 XML과 로그를 프로젝트 기준 이 폴더에 쓴다.
      #   이미지 태그는 ProjectSettings/ProjectVersion.txt의 버전으로 자동 결정된다
      #   (unityci/editor:ubuntu-<버전>-base-3). 컴파일 에러가 있으면 테스트 전에 실패한다.
      - name: Run Unity tests
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          game-ci test . \
            --docker \
            --testPlatforms "editmode;playmode" \
            --coverageEnabled false \
            --artifactsPath artifacts

      # 테스트 결과 XML(NUnit 3 형식)을 읽어 PR에 "Unity Test Results" 체크와 실패 항목 주석을 단다.
      # 테스트가 실패했을 때도 결과를 보여야 하므로 always().
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Unity Test Results
          path: artifacts/*-results.xml
          reporter: dotnet-nunit
          fail-on-error: true
          fail-on-empty: false

      # 결과 XML과 에디터 로그를 아티팩트로 남긴다. 원인 분석용이므로 실패 시에도 남긴다.
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts
          retention-days: 14
