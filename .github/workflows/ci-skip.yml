# 유니티와 무관한 파일만 바뀐 PR(문서, CLAUDE.md 등)을 위한 통과용 워크플로.
#
# 왜 필요한가:
#   main·dev 보호 규칙이 "Unity Tests" 체크 통과를 요구한다. 그런데 ci.yml은 Assets/Packages/
#   ProjectSettings/workflows가 바뀐 PR에서만 돌기 때문에, 문서만 고친 PR은 체크가 아예 만들어지지
#   않아 머지가 영구히 막힌다. 이 워크플로는 ci.yml과 정확히 반대 조건(paths-ignore)으로 돌면서
#   같은 이름의 잡을 즉시 성공시켜 그 빈자리를 채운다.
#
# 규칙:
#   - 여기의 paths-ignore 목록은 ci.yml의 paths 목록과 항상 같아야 한다. 한쪽을 고치면 다른 쪽도 고친다.
#   - 잡 이름 "Unity Tests"는 ci.yml의 잡 이름, 그리고 보호 규칙의 필수 체크 이름과 같아야 한다.
#   - paths는 "하나라도 바뀌면 실행", paths-ignore는 "전부 제외 목록에 해당할 때만 실행"이라
#     두 워크플로는 서로 겹치지 않는다.

name: CI

on:
  pull_request:
    paths-ignore:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    name: Unity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip Unity tests
        run: echo "유니티 관련 파일 변경이 없어 테스트를 건너뜁니다. 보호 규칙의 필수 체크를 통과 처리합니다."
